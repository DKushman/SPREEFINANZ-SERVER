server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Keep public URLs extensionless.
    if ($request_uri = "/index.html") {
        return 301 /;
    }
    if ($request_uri ~ "^(.+)\\.html(\\?.*)?$") {
        return 301 $1$2;
    }

    # Long cache for static assets (hashed filenames are immutable).
    location ~* \.(?:js|css|png|jpe?g|gif|webp|svg|ico|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Custom head scripts/styles change without hashed filenames — shorter cache.
    location /assets/local-head/ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;

        add_header Cache-Control "no-cache";

        sub_filter '</body>' '<script type="text/plaintext" data-ehcookieblocker="tracking"></script><script defer src="/assets/local-head/marketing-consent.js"></script><script defer src="/assets/local-head/ga-bootstrap.js"></script><script defer src="/assets/local-head/linkedin-insight.js"></script></body>';
        sub_filter_once on;
        sub_filter_types text/html;
    }
}
