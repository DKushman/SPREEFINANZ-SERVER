map_hash_bucket_size 256;
map_hash_max_size 8192;

map $uri $legacy_redirect_target {
    default "";
    include /etc/nginx/conf.d/legacy-redirect-map.inc;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Keep public URLs extensionless.
    if ($request_uri = "/index.html") {
        return 301 /;
    }
    if ($request_uri ~ "^(.+)\\.html(\\?.*)?$") {
        return 301 $1$2;
    }

    # Legacy URLs → canonical paths (generated by scripts/legacy_seo_cleanup.py)
    if ($legacy_redirect_target != "") {
        return 301 $legacy_redirect_target$is_args$args;
    }

    # --- Canonical URLs (lowercase) → actual paths in Vite dist (case-sensitive FS) ---

    # Menu hubs: public URL is /blog, /portfolio, … but files live under /menu/*.html
    # (= before /portfolio/ case-study dir avoids 301→403 on directory slash)
    location = /blog {
        try_files /menu/blog.html =404;
    }
    location = /portfolio {
        try_files /menu/portfolio.html =404;
    }
    location = /kontakt {
        try_files /menu/kontakt.html =404;
    }
    location = /team {
        try_files /menu/team.html =404;
    }
    location = /impressum {
        try_files /menu/impressum.html =404;
    }
    location = /datenschutz {
        try_files /menu/datenschutz.html =404;
    }
    location = /preisrechner {
        try_files /menu/preisrechner.html =404;
    }

    # Fakten overview (canonical /fakten)
    location = /fakten {
        try_files /fakten/fakten1.html =404;
    }

    # Blog posts: canonical /blog/slug → file blog/slug.html
    location ~ ^/blog/([^/]+)$ {
        try_files /blog/$1.html =404;
    }

    # Slug differs from filename (ampersand in file)
    location = /leistungen/kanzleien-berater {
        try_files /leistungen/kanzlein&berater.html =404;
    }

    # Odd paths (folder name with spaces in repo)
    location = /fragebogen {
        try_files "/anderes a hrefs/fragebogen.html" =404;
    }
    location = /leistungen/websites {
        try_files "/anderes a hrefs/service1.html" =404;
    }

    # Persona pages: canonical /leistungen/{branch}/{persona}/{page} → leistungsunterpunkte/
    location ~ ^/leistungen/([^/]+)/([^/]+)/(website|kundengewinnung)$ {
        try_files /leistungsunterpunkte/$1/$2/$3.html =404;
    }

    # Lowercase URL segments → dist folder names (case-sensitive FS). try_files avoids rewrite+last 403 in regex locations.
    location ~ ^/leistungen/(.+)$ {
        try_files /leistungen/$1 /leistungen/$1.html =404;
    }
    location ~ ^/leistungsunterpunkte/(.+)$ {
        try_files /leistungsunterpunkte/$1 /leistungsunterpunkte/$1.html =404;
    }
    location ~ ^/fakten/(.+)$ {
        try_files /fakten/$1 /fakten/$1.html =404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
